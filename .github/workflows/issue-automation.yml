name: Issue Automation

on:
  issues:
    types: [opened]

jobs:
  format-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Format Issue Title and Clean Body
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            
            // Parse form data
            const platformMatch = body.match(/### 플랫폼\s*\n\s*(.+)/);
            const tierMatch = body.match(/### 티어\s*\n\s*(.+)/);
            const problemNumberMatch = body.match(/### 문제 번호\s*\n\s*(.+)/);
            const levelMatch = body.match(/### Level\s*\n\s*(.+)/);
            const titleMatch = body.match(/### 문제 이름\s*\n\s*(.+)/);
            const remarksMatch = body.match(/### 비고\s*\n\s*([\s\S]*?)(?=\n###|$)/);
            
            const platform = platformMatch ? platformMatch[1].trim() : '';
            const tier = tierMatch ? tierMatch[1].trim() : '';
            const problemNumber = problemNumberMatch ? problemNumberMatch[1].trim() : '';
            const level = levelMatch ? levelMatch[1].trim() : '';
            const problemTitle = titleMatch ? titleMatch[1].trim() : '';
            const remarks = remarksMatch ? remarksMatch[1].trim() : '';
            
            // Build new title based on platform
            let newTitle = '';
            if (platform === 'Baekjoon' && tier && problemNumber) {
              newTitle = `${platform} ${tier} ${problemNumber}`;
            } else if (platform === 'Programmers' && level && problemTitle) {
              newTitle = `${platform} LV${level} - ${problemTitle}`;
            } else {
              newTitle = `${platform}`;
            }
            
            // Build clean body based on platform
            let newBody = `### 플랫폼\n${platform}\n\n`;
            
            if (platform === 'Baekjoon') {
              if (tier && tier !== 'No response' && tier !== '_No response_') {
                newBody += `### 티어\n${tier}\n\n`;
              }
              if (problemNumber && problemNumber !== 'No response' && problemNumber !== '_No response_') {
                newBody += `### 문제 번호\n${problemNumber}\n\n`;
              }
            } else if (platform === 'Programmers') {
              if (level && level !== 'No response' && level !== '_No response_') {
                newBody += `### Level\n${level}\n\n`;
              }
              if (problemTitle && problemTitle !== 'No response' && problemTitle !== '_No response_') {
                newBody += `### 문제 이름\n${problemTitle}\n\n`;
              }
            }
            
            // Add remarks if provided
            if (remarks && remarks !== 'No response' && remarks !== '_No response_') {
              newBody += `### 비고\n${remarks}\n\n`;
            }
            
            // Remove trailing newlines
            newBody = newBody.trim();
            
            // Update issue title and body
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title: newTitle,
              body: newBody
            });
            
            console.log(`Updated issue #${issue.number}`);
            console.log(`New title: ${newTitle}`);
